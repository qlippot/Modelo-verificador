[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelo-verificador"
version = "0.1.0"
description = "Verificación y codificación del Modelo de Datos Geográfico ICANH V4 (sin IA)"
requires-python = ">=3.10"
dependencies = ["pyshp>=2.3", "openpyxl>=3.1", "xlrd>=2.0", "shapely>=2.0"]

[project.optional-dependencies]
raster = ["rasterio>=1.3"]
dev = ["pytest>=8"]

[project.scripts]
modelo-verificador = "modelo_verificador.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["modelo_verificador*"]
